<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID RUNNERS - Tron Legacy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="loading-screen">
        <div class="spinner-border text-info" role="status"></div>
        <div id="loading-text">RECONSTRUYENDO EL GRID...</div>
    </div>

    <div class="container text-center">
        <div class="logo-section my-4">
            <h1 class="logo-text">GRID RUNNERS</h1>
            <p class="subtitle">SOBREVIVE AL RASTRO DE LUZ</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-9">
                <div id="game-container">
                    <canvas id="game-canvas"></canvas>
                </div>
                
                <div class="score-display my-3">
                    <span class="player-1">JUGADOR 1: 0</span> | 
                    <span class="player-2">JUGADOR 2: 0</span>
                </div>
                
                <div class="controls-panel row">
                    <div class="col-md-6">
                        <button id="start-btn" class="btn btn-tron w-100">INICIAR JUEGO</button>
                        <button id="reset-btn" class="btn btn-tron w-100 mt-2">RESETEAR SISTEMA</button>
                    </div>
                    <div class="col-md-6">
                        <select id="game-mode" class="form-select btn-tron h-100">
                            <option value="single">1 JUGADOR VS CPU</option>
                            <option value="multi">2 JUGADORES (LOCAL)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="music-controls">
        <button id="music-btn">♫</button>
    </div>
    
    <div class="modal fade" id="gameOverModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title w-100 text-center" id="gameOverTitle">FIN DE LA LÍNEA</h5>
                </div>
                <div class="modal-body text-center fs-4" id="gameOverBody"></div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-tron" data-bs-dismiss="modal">REINTENTAR</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="background-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <audio id="game-start-sound"><source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg"></audio>
    <audio id="crash-sound"><source src="https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3" type="audio/mpeg"></audio>
    <audio id="powerup-sound"><source src="https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3" type="audio/mpeg"></audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
